plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aether.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.aether.browser"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.12.0'
    
    // Mozilla GeckoView 80.0 Beta (Supports Android 4.4 API 19, ES2020: ?. and ??, full CSS Flexbox & Grid)
    implementation ("org.mozilla.geckoview:geckoview-beta:80.0.20200728204253") {
        exclude module: 'snakeyaml'
    }
    implementation "org.yaml:snakeyaml:1.26:android"
}
